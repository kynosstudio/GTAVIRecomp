<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">XlaunchVI — Xbox Series X|S Compatibility Layer for Windows (social preview)</title>
  <!-- GitHub social preview, 1280x640 (2:1). Original artwork; unofficial project, not affiliated with Microsoft or Xbox. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C150F"/><stop offset="0.6" stop-color="#080B09"/><stop offset="1" stop-color="#040605"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#107C10" stop-opacity="0.40"/><stop offset="0.7" stop-color="#0B4F12" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0B4F12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2622"/><stop offset="1" stop-color="#080B09"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BE35B"/><stop offset="0.55" stop-color="#107C10"/><stop offset="1" stop-color="#0B4F12"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9CFCB"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" transform="translate(640 230)">
    <path d="M 220.5 -185.0 A 288 288 0 1 1 -50.0 -283.6" stroke="#107C10" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M 168.6 -141.5 A 220 220 0 1 1 -38.2 -216.7" stroke="#107C10" stroke-opacity="0.22" stroke-width="2"/>
  </g>
  <g transform="translate(560 130) scale(0.625)">
    <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#tile)"/>
    <rect x="4.5" y="4.5" width="247" height="247" rx="55.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M 189.3 76.6 A 80 80 0 1 1 114.1 49.2" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 112 92 L 160 128 L 112 164 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <text x="640" y="402" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif"
        font-size="96" font-weight="700" letter-spacing="-2" fill="url(#word)">Xlaunch<tspan fill="#2FAA2F">VI</tspan></text>
  <text x="640" y="458" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="600"
        fill="#E8ECE9">Xbox Series X|S Compatibility Layer for Windows</text>
  <text x="640" y="504" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="500"
        letter-spacing="2.5" fill="#8C968F">NATIVE x86-64  ·  RDNA 2 → DXIL / SPIR-V  ·  DIRECT3D 12  ·  VULKAN</text>
  <text x="640" y="604" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15"
        fill="#5E6862">Experimental · unofficial · not affiliated with Microsoft or Xbox</text>
</svg>
