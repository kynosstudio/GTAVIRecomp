<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">XlaunchVI mark</title>
  <!-- Original XlaunchVI mark (matches the XlaunchVI Home app icon): dark rounded tile, open green launch ring,
       white play chevron. Not affiliated with or derived from any Microsoft or Xbox logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2622"/>
      <stop offset="1" stop-color="#080B09"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BE35B"/>
      <stop offset="0.55" stop-color="#107C10"/>
      <stop offset="1" stop-color="#0B4F12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#107C10" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#107C10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="247" height="247" rx="55.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="128" cy="128" r="92" fill="url(#glow)"/>
  <!-- open ring: 300 degrees, gap at the upper right -->
  <path d="M 189.3 76.6 A 80 80 0 1 1 114.1 49.2" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"/>
  <!-- play chevron -->
  <path d="M 112 92 L 160 128 L 112 164 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
</svg>
