name: Supabase Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Run migrations
        run: supabase db push --project-ref fefvytprogasugctxdom
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start local Supabase
        id: local-supabase
        run: supabase start

      - name: Lint database schema
        run: supabase db lint --schema public --fail-on error

      - name: Stop local Supabase
        if: always() && steps.local-supabase.outcome == 'success'
        run: supabase stop