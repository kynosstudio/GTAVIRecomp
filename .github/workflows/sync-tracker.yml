name: Sync KynosRecompVI tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tracker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync tracker from upstream
        run: node scripts/sync-tracker.mjs

      - name: Build localized data and file protocol fallback
        run: python scripts/build_tracker_ptbr.py

      - name: Validate tracker JSON and local translations
        run: node -e "const fs=require('fs'); const tracker=JSON.parse(fs.readFileSync('data/tracker.json','utf8')); const pt=JSON.parse(fs.readFileSync('data/tracker-pt-BR.json','utf8')); if(!tracker||typeof tracker!=='object') throw new Error('tracker.json invalido'); if(!Array.isArray(tracker.efforts)||!Array.isArray(tracker.news)) throw new Error('Arrays principais ausentes'); const x=pt.teams?.xlaunchvi?.latestReport; if(!x||x.estimatedPercent!==55) throw new Error('Relato local do XLaunchVI deve permanecer em 55%'); const scores=new Map(pt.efforts.map(e=>[e.id,e.manualScore])); if(scores.get('xlaunchvi')!==55||scores.get('cgbj')!==75) throw new Error('Overrides manuais do Kynos foram alterados'); const fb=fs.readFileSync('data/file-fallback.js','utf8'); if(!fb.includes('trackerRaw')||!fb.includes('trackerLocalized')) throw new Error('Fallback file:// incompleto'); console.log('JSON validado:',tracker.efforts.length,'projetos,',tracker.news.length,'noticias');"

      - name: Detect real tracker changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/tracker.json data/tracker-pt-BR.json data/file-fallback.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push tracker snapshot
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json data/tracker-pt-BR.json data/file-fallback.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync tracker snapshot" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
